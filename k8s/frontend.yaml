# ---- Frontend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hangar-frontend
  namespace: hangar
  labels:
    app.kubernetes.io/name: hangar-frontend
    app.kubernetes.io/part-of: hangar
    app.kubernetes.io/component: frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hangar-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hangar-frontend
        app.kubernetes.io/part-of: hangar
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: frontend
          image: ghcr.io/moazzam75/Hangar/hangar-frontend:04623b2
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Nginx needs write for cache/pid
            runAsNonRoot: true
            runAsUser: 101 # nginx user UID in alpine
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

---
# ---- Frontend Service (LoadBalancer — for access via external IP) ----
apiVersion: v1
kind: Service
metadata:
  name: hangar-frontend
  namespace: hangar
  labels:
    app.kubernetes.io/name: hangar-frontend
    app.kubernetes.io/part-of: hangar
    app.kubernetes.io/component: frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: hangar-frontend
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
