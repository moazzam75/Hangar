# ---- PersistentVolumeClaim for PostgreSQL (EBS) ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hangar-db-pvc
  namespace: hangar
  labels:
    app.kubernetes.io/part-of: hangar
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hangar-ebs-sc
  resources:
    requests:
      storage: 10Gi

      